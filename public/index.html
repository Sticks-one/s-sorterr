<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey answers</title>
<style>
:root{--bg:#eef2f6;--surface:#fff;--ink:#14213d;--muted:#5b6b82;--line:#d3dbe6;--accent:#1d4ed8;--on:#fff;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0e1522;--surface:#162033;--ink:#e6ecf5;--muted:#93a3bb;--line:#2a3850;--accent:#6b9bff;--on:#0e1522;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.7rem;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-weight:500;font-size:.9rem;margin-bottom:4px}
input,select,button{font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input[type=file]{padding:6px}
button{width:auto;cursor:pointer;font-weight:500;background:var(--surface)}
button.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.msg{margin:0;font-size:.9rem;color:var(--muted)}.msg.err{color:var(--err)}
#preview{max-height:70px;border-radius:4px;display:none;margin-top:6px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{padding:0}
th button{all:unset;box-sizing:border-box;display:flex;gap:6px;width:100%;padding:10px 12px;cursor:pointer;font-weight:600}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
th.on{box-shadow:inset 0 -3px 0 var(--accent)}
td img{width:56px;height:56px;object-fit:cover;border-radius:6px;cursor:zoom-in;display:block}
tr:last-child td{border-bottom:0}
.empty{text-align:center;color:var(--muted);padding:28px}
.count{font-size:.85rem;color:var(--muted);margin:0 0 8px}
dialog{border:0;border-radius:10px;padding:8px;max-width:92vw;background:var(--surface)}
dialog img{max-width:100%;max-height:80vh;display:block}
dialog::backdrop{background:rgba(0,0,0,.6)}
mark{background:#fde68a;color:#14213d;border-radius:2px;padding:0 1px}
.del{padding:4px 10px;font-size:.82rem}
</style>
</head>
<body>
<main>
<h1>Survey answers</h1>
<p class="sub">Search what others have submitted, or add your own entry.</p>

<section class="panel">
  <label for="q">Search past entries by survey website</label>
  <input id="q" type="search" list="sites" placeholder="e.g. surveymonkey.com" autocomplete="off">
  <datalist id="sites"></datalist>
</section>

<form class="panel" id="form">
  <div class="grid">
    <div><label for="website">Survey website</label><input id="website" required maxlength="200" placeholder="e.g. surveymonkey.com"></div>
    <div><label for="age">Age entered by the survey taker</label><input id="age" type="number" min="1" max="120" required></div>
    <div><label for="image">Image of the answer</label><input id="image" type="file" accept="image/*" required><img id="preview" alt="Selected image preview"></div>
  </div>
  <div class="row"><button class="primary" id="add" type="submit">Add entry</button><p class="msg" id="msg" role="status"></p></div>
</form>

<div class="row" style="margin:0 0 12px">
  <select id="rng" aria-label="Filter by age range" style="width:auto"></select>
  <button id="refresh" type="button">Refresh</button>
</div>
<p class="count" id="count"></p>
<div class="wrap"><table id="tbl"></table></div>
<dialog id="dlg"><img id="big" alt="Answer image, full size"></dialog>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var RANGES=[["Under 18",0,17],["18–24",18,24],["25–34",25,34],["35–44",35,44],["45–54",45,54],["55–64",55,64],["65+",65,200]];
var data=[],sk="added",dir="desc";
function range(a){for(var i=0;i<RANGES.length;i++)if(a>=RANGES[i][1]&&a<=RANGES[i][2])return RANGES[i][0];return"—"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().trim().replace(/^[a-z]+:\/\//,"").replace(/^www\./,"").replace(/\/+$/,"")}
function hl(t,q){
  if(!q)return esc(t);
  var i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length));
}
function sites(){
  var seen={};data.forEach(function(e){seen[e.website]=1});
  $("sites").innerHTML=Object.keys(seen).sort().slice(0,200).map(function(w){return'<option value="'+esc(w)+'">'}).join("");
}
function say(t,err){var m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"")}

$("rng").innerHTML='<option value="">All age ranges</option>'+RANGES.map(function(r){return"<option>"+r[0]+"</option>"}).join("");

function load(){
  fetch("/api/entries").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){data=d;sites();render()})
  .catch(function(){$("tbl").innerHTML='<tbody><tr><td class="empty">Couldn’t load entries. Check your connection and press Refresh.</td></tr></tbody>'});
}
function render(){
  var raw=$("q").value.trim(),q=norm(raw),rg=$("rng").value;
  var list=data.filter(function(e){return(!q||norm(e.website).indexOf(q)>-1)&&(!rg||range(e.age)===rg)});
  list.sort(function(a,b){
    var x=a[sk==="range"?"age":sk],y=b[sk==="range"?"age":sk],r=typeof x==="string"?x.localeCompare(y,undefined,{sensitivity:"base"}):x-y;
    return dir==="asc"?r:-r;
  });
  var cols=[["website","Survey website"],["age","Age"],["range","Age range"],["added","Added"]];
  var h="<thead><tr><th>Image</th>"+cols.map(function(c){
    var on=sk===c[0];
    return'<th class="'+(on?"on":"")+'" aria-sort="'+(on?(dir==="asc"?"ascending":"descending"):"none")+'"><button data-k="'+c[0]+'">'+c[1]+' <span aria-hidden="true">'+(on?(dir==="asc"?"▲":"▼"):"⇅")+"</span></button></th>";
  }).join("")+"<th></th></tr></thead><tbody>";
  if(!list.length)h+='<tr><td class="empty" colspan="6">'+(data.length?(raw?"No entries found for that website. Try a shorter part of the name, or add the first one below.":"No entries match that age range."):"No entries yet. Add the first one below.")+"</td></tr>";
  list.forEach(function(e){
    h+='<tr><td><img src="/api/image?id='+e.id+'" alt="Answer from '+esc(e.website)+'" loading="lazy" data-id="'+e.id+'"></td><td>'+hl(e.website,raw)+"</td><td>"+e.age+"</td><td>"+range(e.age)+"</td><td>"+new Date(e.added).toLocaleDateString()+'</td><td><button class="del" data-del="'+e.id+'">Delete</button></td></tr>';
  });
  $("tbl").innerHTML=h+"</tbody>";
  $("count").textContent=raw?list.length+" of "+data.length+" entries match \u201C"+raw+"\u201D":"Showing "+list.length+" of "+data.length+" entries";
}
$("tbl").addEventListener("click",function(e){
  var k=e.target.closest("[data-k]"),im=e.target.closest("img[data-id]"),d=e.target.closest("[data-del]");
  if(k){var n=k.getAttribute("data-k");if(sk===n)dir=dir==="asc"?"desc":"asc";else{sk=n;dir=n==="website"?"asc":"desc"}render()}
  if(im){$("big").src="/api/image?id="+im.getAttribute("data-id");$("dlg").showModal()}
  if(d){
    var pw=sessionStorage.getItem("pw")||prompt("Admin password to delete this entry:");
    if(!pw)return;
    fetch("/api/entries?id="+d.getAttribute("data-del"),{method:"DELETE",headers:{"x-admin-password":pw}})
    .then(function(r){return r.json().then(function(j){if(!r.ok){sessionStorage.removeItem("pw");alert(j.error);return}sessionStorage.setItem("pw",pw);load()})});
  }
});
$("dlg").onclick=function(){$("dlg").close()};
$("q").oninput=render;$("rng").onchange=render;$("refresh").onclick=load;

function shrink(file){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.82));
    };
    img.onerror=function(){rej(new Error("That file isn’t a readable image."))};
    img.src=u;
  });
}
$("image").onchange=function(){
  var f=this.files[0],p=$("preview");
  if(f){p.src=URL.createObjectURL(f);p.style.display="block"}else p.style.display="none";
};
$("form").onsubmit=function(ev){
  ev.preventDefault();
  var b=$("add");b.disabled=true;say("Uploading…");
  shrink($("image").files[0]).then(function(img){
    return fetch("/api/entries",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({website:$("website").value,age:$("age").value,image:img})});
  }).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Upload failed.");return j})})
  .then(function(){$("form").reset();$("preview").style.display="none";say("Entry added.");load()})
  .catch(function(e){say(e.message,true)})
  .then(function(){b.disabled=false});
};
load();
})();
</script>
</body>
</html>
