<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey answers</title>
<style>
:root{--bg:#eef2f6;--surface:#fff;--ink:#14213d;--muted:#5b6b82;--line:#d3dbe6;--accent:#1d4ed8;--on:#fff;--err:#b42318;--tag:#e3ebfb}
@media (prefers-color-scheme:dark){:root{--bg:#0e1522;--surface:#162033;--ink:#e6ecf5;--muted:#93a3bb;--line:#2a3850;--accent:#6b9bff;--on:#0e1522;--err:#ff8a80;--tag:#22314d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.7rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 12px}.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.full{grid-column:1/-1}
label{display:block;font-weight:500;font-size:.9rem;margin-bottom:4px}
input,select,textarea,button{font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:72px;resize:vertical}
input[type=file]{padding:6px}
button{width:auto;cursor:pointer;font-weight:500;background:var(--surface)}
button.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.msg{margin:0;font-size:.9rem;color:var(--muted)}.msg.err{color:var(--err)}
.hint{font-size:.82rem;color:var(--muted);margin:4px 0 0}
#previews{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#previews img{height:56px;border-radius:4px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
.count{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}
.site{font-weight:600;font-size:1.05rem}
.tag{background:var(--tag);border-radius:999px;padding:1px 10px;font-size:.8rem}
.meta{color:var(--muted);font-size:.85rem}
.note{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:6px;cursor:zoom-in;border:1px solid var(--line)}
.del{padding:3px 10px;font-size:.8rem;margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:28px}
mark{background:#fde68a;color:#14213d;border-radius:2px;padding:0 1px}
dialog{border:0;border-radius:10px;padding:10px;max-width:94vw;background:var(--surface);color:var(--ink)}
dialog img{max-width:100%;max-height:75vh;display:block;margin:0 auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
#newsite{display:none;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Survey answers</h1>
<p class="sub">Search what others have shared about a survey website, or add your own entry.</p>

<section class="panel">
  <label for="q">Search by survey website</label>
  <input id="q" type="search" list="sites" placeholder="e.g. YouGov, Savanta, SurveyMonkey" autocomplete="off">
  <datalist id="sites"></datalist>
  <div class="filters">
    <span style="display:none"></span>
    <select id="fcat" aria-label="Filter by category"></select>
    <select id="frng" aria-label="Filter by age range"></select>
    <select id="sort" aria-label="Sort entries">
      <option value="new">Newest first</option><option value="old">Oldest first</option>
      <option value="site">Website A–Z</option><option value="cat">Category A–Z</option>
    </select>
  </div>
</section>

<p class="count" id="count"></p>
<div id="list"></div>

<form class="panel" id="form" style="margin-top:20px">
  <h2>Add an entry</h2>
  <div class="grid">
    <div><label for="site">Survey website</label>
      <select id="site" required></select>
      <input id="newsite" maxlength="100" placeholder="Type the website name" aria-label="New website name">
    </div>
    <div><label for="cat">Category</label><select id="cat" required></select></div>
    <div><label for="age">Age entered by the survey taker</label><input id="age" type="number" min="1" max="120" required></div>
    <div class="full"><label for="note">Short note for others</label>
      <textarea id="note" maxlength="300" required placeholder="e.g. Pays within a week, but screens out a lot of people."></textarea>
      <p class="hint">Up to 300 characters.</p></div>
    <div class="full"><label for="image">Images of the answer (up to 5)</label>
      <input id="image" type="file" accept="image/*" multiple required><div id="previews"></div></div>
  </div>
  <div class="row"><button class="primary" id="add" type="submit">Add entry</button><p class="msg" id="msg" role="status"></p></div>
</form>

<dialog id="dlg"><img id="big" alt="Answer image, full size"><div class="nav"><button type="button" id="prev">Previous</button><span id="pos" class="meta"></span><button type="button" id="next">Next</button><button type="button" id="close">Close</button></div></dialog>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var CATS=["Cars & transport","Food & drink","Politics & news","Business & work","Health & illness","Shopping & retail","Technology","Finance & banking","Travel & holidays","Entertainment & media","Education","Home & garden","Fashion & beauty","Sports & fitness","Other"];
var RANGES=[["Under 18",0,17],["18–24",18,24],["25–34",25,34],["35–44",35,44],["45–54",45,54],["55–64",55,64],["65+",65,200]];
var KNOWN=[["YouGov",["you gov"]],["Prolific",[]],["Savanta",["crowdology","yourvue","attapoll"]],["Crowdology",["savanta"]],["Clariti",["clarity"]],["Y-Live",["ylive","y live"]],["Toluna",["toluna influencers"]],["Swagbucks",[]],["Ipsos iSay",["i-say","isay"]],["Qmee",[]],["OnePoll",["one poll"]],["Valued Opinions",[]],["Branded Surveys",[]],["Opinion Outpost",[]],["Paid Viewpoint",[]],["SurveyMonkey",["survey monkey"]]];
var data=[],cur=[],gi=0;
function key(s){return String(s).toLowerCase().replace(/^[a-z]+:\/\//,"").replace(/^www\./,"").replace(/[^a-z0-9]/g,"")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function range(a){for(var i=0;i<RANGES.length;i++)if(a>=RANGES[i][1]&&a<=RANGES[i][2])return RANGES[i][0];return"—"}
function hl(t,q){if(!q)return esc(t);var i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))}
function aliases(name){var k=key(name);for(var i=0;i<KNOWN.length;i++)if(key(KNOWN[i][0])===k)return KNOWN[i][1].map(key);return[]}
function say(t,err){var m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"")}
function opts(a,first){return(first?'<option value="">'+first+"</option>":"")+a.map(function(x){return"<option>"+esc(x)+"</option>"}).join("")}

$("fcat").innerHTML=opts(CATS,"All categories");
$("frng").innerHTML=opts(RANGES.map(function(r){return r[0]}),"All age ranges");
$("cat").innerHTML=opts(CATS,"Choose a category");

function siteLists(){
  var known={};KNOWN.forEach(function(k){known[key(k[0])]=1});
  var extra={};data.forEach(function(e){if(!known[key(e.website)])extra[e.website]=1});
  var ex=Object.keys(extra).sort(function(a,b){return a.localeCompare(b)});
  var cur=$("site").value;
  $("site").innerHTML='<option value="">Choose a website</option><optgroup label="Popular UK survey sites">'+opts(KNOWN.map(function(k){return k[0]}).sort())+"</optgroup>"+(ex.length?'<optgroup label="Added by others">'+opts(ex)+"</optgroup>":"")+'<option value="__new">Add a new website…</option>';
  $("site").value=cur;
  $("sites").innerHTML=KNOWN.map(function(k){return k[0]}).concat(ex).map(function(w){return'<option value="'+esc(w)+'">'}).join("");
}
$("site").onchange=function(){var n=$("site").value==="__new";$("newsite").style.display=n?"block":"none";$("newsite").required=n};

function load(){
  fetch("/api/entries").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){data=d;siteLists();render()})
  .catch(function(){$("list").innerHTML='<div class="empty">Couldn’t load entries. Check your connection and refresh the page.</div>'});
}
function imgs(e){return e.images&&e.images.length?e.images:[e.id]}
function render(){
  var raw=$("q").value.trim(),kq=key(raw),fc=$("fcat").value,fr=$("frng").value,so=$("sort").value;
  var list=data.filter(function(e){
    var m=!kq||key(e.website).indexOf(kq)>-1||aliases(e.website).some(function(a){return a.indexOf(kq)>-1});
    return m&&(!fc||e.category===fc)&&(!fr||range(e.age)===fr);
  });
  list.sort(function(a,b){
    if(so==="old")return a.added-b.added;
    if(so==="site")return a.website.localeCompare(b.website,undefined,{sensitivity:"base"});
    if(so==="cat")return(a.category||"~").localeCompare(b.category||"~");
    return b.added-a.added;
  });
  cur=list;
  $("count").textContent=raw?list.length+" of "+data.length+" entries match \u201C"+raw+"\u201D":"Showing "+list.length+" of "+data.length+" entries";
  if(!list.length){$("list").innerHTML='<div class="empty">'+(data.length?"No entries match those filters. Try a shorter part of the website name, or clear a filter.":"No entries yet. Add the first one below.")+"</div>";return}
  $("list").innerHTML=list.map(function(e,n){
    return'<article class="card"><div class="top"><span class="site">'+hl(e.website,raw)+'</span><span class="tag">'+esc(e.category||"Uncategorised")+'</span><span class="meta">Age '+e.age+" ("+range(e.age)+") · "+new Date(e.added).toLocaleDateString()+'</span><button class="del" data-del="'+e.id+'">Delete</button></div>'+
    (e.note?'<p class="note">'+esc(e.note)+"</p>":"")+
    '<div class="thumbs">'+imgs(e).map(function(k,i){return'<img src="/api/image?id='+k+'" alt="Answer image '+(i+1)+" from "+esc(e.website)+'" loading="lazy" data-e="'+n+'" data-i="'+i+'">'}).join("")+"</div></article>";
  }).join("");
}
$("list").addEventListener("click",function(e){
  var im=e.target.closest("img[data-e]"),d=e.target.closest("[data-del]");
  if(im){gi=+im.getAttribute("data-i");gal=imgs(cur[+im.getAttribute("data-e")]);show();$("dlg").showModal()}
  if(d){
    var pw=sessionStorage.getItem("pw")||prompt("Admin password to delete this entry:");
    if(!pw)return;
    fetch("/api/entries?id="+d.getAttribute("data-del"),{method:"DELETE",headers:{"x-admin-password":pw}})
    .then(function(r){return r.json().then(function(j){if(!r.ok){sessionStorage.removeItem("pw");alert(j.error);return}sessionStorage.setItem("pw",pw);load()})});
  }
});
var gal=[];
function show(){$("big").src="/api/image?id="+gal[gi];$("pos").textContent=(gi+1)+" of "+gal.length;$("prev").disabled=gi===0;$("next").disabled=gi===gal.length-1}
$("prev").onclick=function(){if(gi>0){gi--;show()}};
$("next").onclick=function(){if(gi<gal.length-1){gi++;show()}};
$("close").onclick=function(){$("dlg").close()};
["q","fcat","frng","sort"].forEach(function(i){$(i).oninput=render;$(i).onchange=render});

function shrink(file){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.75));
    };
    img.onerror=function(){rej(new Error("One of those files isn’t a readable image."))};
    img.src=u;
  });
}
$("image").onchange=function(){
  var p=$("previews");p.innerHTML="";
  if(this.files.length>5){say("Choose up to 5 images.",true);this.value="";return}
  say("");
  Array.prototype.forEach.call(this.files,function(f){var i=document.createElement("img");i.src=URL.createObjectURL(f);i.alt="Selected image preview";p.appendChild(i)});
};
$("form").onsubmit=function(ev){
  ev.preventDefault();
  var b=$("add"),sv=$("site").value,name=sv==="__new"?$("newsite").value.trim():sv;
  var k=key(name);for(var i=0;i<KNOWN.length;i++)if(key(KNOWN[i][0])===k)name=KNOWN[i][0];
  data.forEach(function(e){if(key(e.website)===k)name=e.website});
  b.disabled=true;say("Uploading…");
  Promise.all(Array.prototype.map.call($("image").files,shrink)).then(function(images){
    var body=JSON.stringify({website:name,category:$("cat").value,age:$("age").value,note:$("note").value,images:images});
    if(body.length>5000000)throw new Error("Images are too large. Remove one or use smaller pictures.");
    return fetch("/api/entries",{method:"POST",headers:{"content-type":"application/json"},body:body});
  }).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Upload failed.");return j})})
  .then(function(){$("form").reset();$("previews").innerHTML="";$("newsite").style.display="none";say("Entry added.");load()})
  .catch(function(e){say(e.message,true)})
  .then(function(){b.disabled=false});
};
load();
})();
</script>
</body>
</html>
